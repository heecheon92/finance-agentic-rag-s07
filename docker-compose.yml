# core 3개: qdrant · api · ui.   docker compose up -d   →   http://localhost:8080
#
# 임베디드 Qdrant(파일)는 프로세스 하나만 열 수 있다. 컨테이너가 둘 이상이면 서버 모드가 필요하다.
# 그래서 api 는 QDRANT_URL 로 qdrant 서비스를 본다. 인덱스는 호스트에서 `make index-server` 로 한 번 넣는다.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_storage:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      qdrant: {condition: service_healthy}
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"            # 모델은 볼륨에 있다. 허브에 묻지 않는다(폐쇄망에서도 같은 설정)
      TOKENIZERS_PARALLELISM: "false"
    ports: ["8000:8000"]
    volumes:
      # 모델 가중치는 이미지에 굽지 않는다. 이미지가 4GB 커지고 재빌드가 느려진다.
      - ./models:/models
      - ./data:/app/data:ro
      - ./logs:/app/logs
      # 코드도 볼륨으로 붙인다. 실습에서 채운 함수가 재빌드 없이 컨테이너에 반영된다. 이미지에는 패키지만 굽는다.
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s            # 모델 적재가 끝나기 전에는 실패로 세지 않는다

  ui:
    image: nginx:1.27-alpine
    depends_on: [api]
    ports: ["8080:80"]
    volumes:
      - ./ui/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  qdrant_storage:
