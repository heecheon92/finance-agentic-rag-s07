<!doctype html>
<meta charset="utf-8">
<title>금융문서 Agentic RAG</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1b; --mut:#6b6b66; --line:#e3e3df; --accent:#2b5f9e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header small { color:var(--mut); }
  main { display:grid; grid-template-columns: 1fr 380px; gap:0; height:calc(100vh - 57px); }
  @media (max-width: 900px){ main { grid-template-columns:1fr; height:auto; } }
  #left { padding:24px; overflow:auto; }
  #right { border-left:1px solid var(--line); padding:20px; overflow:auto; background:#fff; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
  button { padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { background:#9aa8ba; cursor:default; }
  #nodes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; min-height:26px; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; background:#eef2f7; color:#3d4b5c; border:1px solid #dbe3ec; }
  .badge.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #answer { white-space:pre-wrap; min-height:120px; padding:16px; background:#fff;
            border:1px solid var(--line); border-radius:8px; }
  .notice { margin-top:10px; padding:9px 12px; border-radius:6px; font-size:13px;
            background:#fff8e6; border:1px solid #f0e0b0; color:#6a5310; }
  .notice.warn { background:#fdecec; border-color:#f2c2c2; color:#7d2020; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 10px; }
  .src { border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin-bottom:10px; background:#fff; }
  .src .m { font-size:12px; color:var(--mut); margin-bottom:5px; }
  .src .t { font-size:13px; color:#333; max-height:88px; overflow:hidden; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; background:#f0f0ec; margin-right:4px; }
  .tag.exp { background:#fdecec; color:#7d2020; }
  .tag.syn { background:#fff2e0; color:#8a4b00; }
</style>
<header>
  <h1>금융문서 Agentic RAG</h1>
  <small id="meta">약관·상품설명서 근거 인용 질의응답</small>
</header>
<main>
  <section id="left">
    <form id="f">
      <input type="text" id="q" placeholder="예: 하나은행 여신거래기본약관 제7조 기한이익 상실 통지는 며칠 전까지인가요?" autocomplete="off">
      <button id="go">질문</button>
    </form>
    <div id="nodes"></div>
    <div id="answer"></div>
    <div id="notices"></div>
  </section>
  <aside id="right">
    <h2>근거</h2>
    <div id="sources"><p style="color:var(--mut);font-size:13px">질문하면 인용한 조항이 여기에 표시됩니다.</p></div>
  </aside>
</main>
<script>
const KEY = new URLSearchParams(location.search).get("key") || "change-me";
const $ = (id) => document.getElementById(id);
const NODES = ["preprocess","rewrite","selfquery","retrieve","grade","answer"];

function resetBadges() {
  $("nodes").innerHTML = NODES.map(n => `<span class="badge" id="b-${n}">${n}</span>`).join("");
}
resetBadges();

function renderSources(list) {
  if (!list.length) return;
  $("sources").innerHTML = list.map((s, i) => `
    <div class="src">
      <div class="m">[${i+1}] ${s.doc_id} ${s.article || ""} ${s.page_start ? "p" + s.page_start : ""}</div>
      <div>
        ${s.effective_from ? `<span class="tag">시행 ${s.effective_from}</span>` : ""}
        ${s.expired ? `<span class="tag exp">심의필 만료</span>` : ""}
        ${s.synthetic_degraded ? `<span class="tag syn">열화 재현본</span>` : ""}
      </div>
      <div class="t">${(s.excerpt || "").replace(/</g,"&lt;")}</div>
    </div>`).join("");
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("go").disabled = true;
  $("answer").textContent = "";
  $("notices").innerHTML = "";
  $("sources").innerHTML = "";
  resetBadges();

  // SSE 는 POST 를 못 쓰므로 fetch 로 스트림을 직접 읽는다.
  const res = await fetch("/ask/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-API-Key": KEY},
    body: JSON.stringify({question: q, stream: true})
  });
  if (!res.ok) {
    $("answer").textContent = `요청 실패 (HTTP ${res.status}). ?key=<API_KEY> 를 확인하세요.`;
    $("go").disabled = false; return;
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", ev = null;
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) {
      if (line.startsWith("event:")) ev = line.slice(6).trim();
      else if (line.startsWith("data:")) {
        let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev === "node_start" && $("b-" + d.node)) $("b-" + d.node).classList.add("on");
        else if (ev === "token") $("answer").textContent += d.text;
        else if (ev === "citation") renderSources(d);
        else if (ev === "done") {
          if (!$("answer").textContent) $("answer").textContent = d.answer || "";
          $("notices").innerHTML = (d.notices || []).map(n =>
            `<div class="notice${/만료|열화/.test(n) ? " warn" : ""}">${n}</div>`).join("");
        }
        else if (ev === "error") $("answer").textContent += `\n[오류] ${d.message}`;
      }
    }
  }
  $("go").disabled = false;
});
</script>
