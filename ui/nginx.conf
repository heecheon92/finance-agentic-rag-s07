# compose 의 ui 서비스. 정적 파일은 여기서 내고, /ask · /health 는 api 컨테이너로 넘긴다.
# 스트리밍은 proxy_buffering 을 꺼야 한다. 켜 두면 nginx 가 응답을 모았다가 한 번에 주어 토큰이 안 흐른다.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /ask {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location /health {
        proxy_pass http://api:8000;
    }
}
